    <title>Intentional Connetions</title>
    <script>
      //  Fix for HashRouter OAuth Redirects
      (function() {
        var path = window.location.pathname;
        if (path.includes('/auth/linkedin/callback')) {
          var search = window.location.search;
          var hash = window.location.hash;
          var newUrl = window.location.origin + '/#/' + path.replace(/^\//, '') + search + hash;
          console.log('🔄 Redirecting to hash route:', newUrl);
          window.location.replace(newUrl);
        }
      })();
    </script>
